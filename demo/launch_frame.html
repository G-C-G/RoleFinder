<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GCG Game Plan: launch film</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700&display=swap">
<style>
:root{--ink:#143a2d;--ink2:#2c3d35;--gold:#F2B01C;--gold2:#a8740a;--green:#2f7a3f}
*{box-sizing:border-box}html,body{margin:0;width:1920px;height:1080px;background:#e9dcc0;color:var(--ink);font-family:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
.bg{position:absolute;inset:0;background:url(assets/bg.jpg) center/cover}
.ex{position:fixed;top:0;left:0;right:0;height:30px;background:rgba(20,58,45,.92);color:rgba(250,246,235,.85);display:grid;place-items:center;font-weight:600;font-size:13px;letter-spacing:.16em;z-index:50}
.left{position:absolute;left:70px;top:236px;width:520px;padding:40px 44px 44px;background:rgba(251,247,236,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:28px;box-shadow:0 18px 50px rgba(60,40,10,.18)}
.lab{display:flex;align-items:center;gap:14px;font-weight:700;font-size:15px;letter-spacing:.26em;color:var(--gold2);transition:color .5s}
.lab i{display:block;width:56px;height:2px;background:currentColor;opacity:.8}.lab.p{color:var(--green)}
.head{font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-size:80px;line-height:.98;letter-spacing:-.012em;margin:26px 0 0;min-height:184px;color:var(--ink)}
.head .w{display:inline-block;opacity:0;transform:translateY(24px);animation:wi .8s cubic-bezier(.2,.7,.2,1) forwards;margin-right:.18em}
@keyframes wi{to{opacity:1;transform:none}}
.rule{width:64px;height:4px;background:var(--gold);margin-top:6px;border-radius:2px}
.sub{font-size:28px;font-weight:500;line-height:1.38;color:var(--ink2);margin-top:22px;max-width:440px;min-height:78px;opacity:0;animation:wi .8s .4s cubic-bezier(.2,.7,.2,1) forwards}
.stack{position:absolute;left:700px;top:50px;width:470px;height:1000px;transform-origin:var(--ox,50%) var(--oy,40%);animation:drift 16s cubic-bezier(.25,.1,.25,1) forwards}
@keyframes drift{from{transform:scale(1)}to{transform:scale(var(--z,1.05))}}
.pf{position:absolute;inset:0;border:10px solid #15140f;border-radius:58px;background:#F6F1E6;overflow:hidden;box-shadow:0 0 0 2px #3a382f,0 40px 70px rgba(60,40,10,.35),0 8px 18px rgba(60,40,10,.25);opacity:0;transition:opacity .7s}
.pf.on{opacity:1}
.pf iframe{position:absolute;left:0;top:0;width:390px;height:844px;border:0;transform:scale(1.153);transform-origin:0 0}
.ban{position:absolute;left:720px;top:110px;width:430px;background:rgba(255,253,246,.98);color:#111;border-radius:24px;padding:15px 20px;z-index:60;box-shadow:0 18px 44px rgba(60,40,10,.35);transform:translateY(-180px);opacity:0;transition:transform .6s cubic-bezier(.2,.9,.2,1),opacity .4s}
.ban.on{transform:none;opacity:1}.ban small{font-size:12px;letter-spacing:.16em;font-weight:700;color:#7a5a00}.ban b{display:block;font-size:19px;font-weight:600;margin-top:4px;line-height:1.25}
.pt{position:absolute;left:0;top:0;width:1920px;height:1080px;pointer-events:none;z-index:80}
.pt .nt{padding:10px 20px 14px;background:rgba(251,247,236,.88);border-radius:18px;box-shadow:0 10px 30px rgba(40,30,10,.18);position:absolute;font-family:"Caveat",cursive;font-weight:600;font-size:44px;line-height:1.02;color:var(--ink);opacity:0;transition:opacity .6s;max-width:400px}
.pt.on .nt{opacity:1}
.pt path{fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .9s cubic-bezier(.3,.1,.2,1) .35s}
.pt.on path{stroke-dashoffset:0}
.pt .hd{opacity:0;transition:opacity .3s 1.1s}.pt.on .hd{opacity:1}
.cursor{position:fixed;z-index:200;width:30px;height:30px;border-radius:50%;background:rgba(242,176,28,.92);border:3px solid #fff;box-shadow:0 0 0 2px rgba(20,58,45,.5);pointer-events:none;transition:left .42s cubic-bezier(.3,.1,.2,1),top .42s cubic-bezier(.3,.1,.2,1);left:-80px;top:-80px}
.cursor.click{animation:rip .45s}@keyframes rip{50%{transform:scale(1.6);opacity:.55}}
.card{position:fixed;inset:0;z-index:300;background:url(assets/bg.jpg) center/cover;display:none;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:0 600px 0 330px;gap:28px}.card.on{display:flex}
.card small{font-size:15px;letter-spacing:.28em;color:var(--gold2);font-weight:700}
.card h1{font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-size:104px;line-height:1;margin:0;max-width:1000px;letter-spacing:-.012em;color:var(--ink)}
.card .w{display:inline-block;opacity:0;transform:translateY(34px);animation:wi 1s cubic-bezier(.2,.7,.2,1) forwards;margin-right:.2em}
.card p{font-size:28px;font-weight:500;color:var(--ink2);margin:0;opacity:0;animation:wi 1s 1.2s forwards;letter-spacing:.03em}
</style></head><body>
<div class="bg"></div><span style="font-family:Caveat;font-weight:600;position:absolute;opacity:0;left:-99px">hello</span>
<div class="ex">EXAMPLE DATA  ·  FICTIONAL PEOPLE, NUMBERS AND COMPANY  ·  NOT REAL RECORDS</div>
<div class="left"><div class="lab" id="chip"><span id="chipt">TEAM LEAD / HR</span><i></i></div><h1 class="head" id="head"></h1><div class="rule"></div><p class="sub" id="sub"></p></div>
<div class="stack" id="stack"><div class="pf on" id="pfA"><iframe id="fA" src="../gcg-game-plan.html"></iframe></div><div class="pf" id="pfB"><iframe id="fB" src="../gcg-game-plan.html"></iframe></div></div>
<svg class="pt" id="pt" viewBox="0 0 1920 1080"><defs></defs><path id="pth" pathLength="1" d=""/><path id="ph1" class="hd" pathLength="1" d="" style="stroke-dasharray:none;stroke-dashoffset:0"/><path id="ph2" class="hd" pathLength="1" d="" style="stroke-dasharray:none;stroke-dashoffset:0"/></svg>
<div class="pt" id="ptn" style="position:absolute"><div class="nt" id="nt"></div></div>
<div class="ban" id="ban"><small>GOLD COAST GAMES</small><b id="bant"></b></div>
<div id="mk" style="position:fixed;left:0;bottom:0;width:14px;height:14px;background:#0c0c0c;z-index:400"></div><div class="card" id="card"></div><div class="cursor" id="cursor"></div>
<script>
var $=function(i){return document.getElementById(i);};
function words(t){return t.split(' ').map(function(w,i){return '<span class="w" style="animation-delay:'+(i*0.1)+'s">'+w+'</span>';}).join('');}
window.beat=function(o){var mk=$('mk');mk.dataset.s=mk.dataset.s==='1'?'0':'1';mk.style.background=mk.dataset.s==='1'?'#2c2c2c':'#0c0c0c';var p=o.group==='p';
 $('chip').classList.toggle('p',p);$('chipt').textContent=o.who||(p?'THE PERSON':'TEAM LEAD / HR');
 $('head').innerHTML=words(o.head);$('sub').style.animation='none';void $('sub').offsetWidth;$('sub').style.animation='';$('sub').textContent=o.sub||'';
 var st=$('stack');st.style.setProperty('--ox',o.ox||'50%');st.style.setProperty('--oy',o.oy||'40%');st.style.setProperty('--z',o.z||1.05);st.style.animation='none';void st.offsetWidth;st.style.animation='';
 window.unpoint();};
// a short hand-lettered note on the right, with an arrow to the thing to look at
window.point=function(text,tx,ty){var nx=1290,ny=Math.max(120,ty-170);var n=$('nt');n.textContent=text;n.style.left=nx+'px';n.style.top=ny+'px';
 var sx=nx+30,sy=ny+120+ (text.length>24?44:0),ex=tx+16,ey=ty;var cx=(sx+ex)/2+30,cy=sy+70;
 $('pth').setAttribute('d','M'+sx+','+sy+' Q'+cx+','+cy+' '+ex+','+ey);
 // arrow head
 var ang=Math.atan2(ey-cy,ex-cx),a1=ang+2.7,a2=ang-2.7,L=22;
 $('ph1').setAttribute('d','M'+ex+','+ey+' L'+(ex+L*Math.cos(a1))+','+(ey+L*Math.sin(a1)));$('ph2').setAttribute('d','M'+ex+','+ey+' L'+(ex+L*Math.cos(a2))+','+(ey+L*Math.sin(a2)));
 var a=$('pt'),b=$('ptn');a.classList.remove('on');b.classList.remove('on');void a.offsetWidth;a.classList.add('on');b.classList.add('on');};
window.unpoint=function(){$('pt').classList.remove('on');$('ptn').classList.remove('on');};
window.show=function(w){$('pfA').classList.toggle('on',w==='A');$('pfB').classList.toggle('on',w==='B');};
window.cur=function(x,y){var c=$('cursor');c.style.left=x+'px';c.style.top=y+'px';};
window.ripple=function(){var c=$('cursor');c.classList.remove('click');void c.offsetWidth;c.classList.add('click');};
window.banner=function(t){var b=$('ban');if(!t){b.classList.remove('on');return;}$('bant').textContent=t;b.classList.add('on');};
window.cardOn=function(h,s,k){var e=$('card');if(!h){e.classList.remove('on');return;}var mk=$('mk');mk.dataset.s=mk.dataset.s==='1'?'0':'1';mk.style.background=mk.dataset.s==='1'?'#2c2c2c':'#0c0c0c';
 window.unpoint();e.innerHTML=(k?'<small>'+k+'</small>':'')+'<h1>'+words(h)+'</h1>'+(s?'<p>'+s+'</p>':'');e.classList.add('on');};
</script></body></html>
