<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GCG Game Plan: launch film</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;700&display=swap">
<style>
:root{--ink:#0a0a0a;--paper:#FAF6EB;--gold:#F2B01C;--green:#3E9B4F;--muted:#8d877a}
*{box-sizing:border-box}html,body{margin:0;width:1920px;height:1080px;background:var(--ink);color:var(--paper);font-family:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
.glow{position:absolute;inset:0;background:radial-gradient(900px 700px at 78% 52%,rgba(242,176,28,.20),transparent 70%);transition:background .9s}
.glow.p{background:radial-gradient(900px 700px at 78% 52%,rgba(62,155,79,.22),transparent 70%)}
.ex{position:fixed;top:0;left:0;right:0;height:34px;background:var(--gold);color:#111;display:grid;place-items:center;font-weight:700;font-size:16px;letter-spacing:.08em;z-index:50}
.left{position:absolute;left:130px;top:170px;width:880px;bottom:110px;display:flex;flex-direction:column}
.chip{display:flex;align-items:center;gap:18px;font-weight:700;font-size:24px;letter-spacing:.2em;color:var(--gold);transition:color .5s}
.chip i{display:block;width:120px;height:3px;background:currentColor}.chip.p{color:var(--green)}
.head{font-family:"DM Serif Display",Georgia,serif;font-weight:400;font-size:118px;line-height:1.02;margin:36px 0 0;min-height:250px}
.head .w{display:inline-block;opacity:0;transform:translateY(34px);filter:blur(10px);animation:wi .7s cubic-bezier(.2,.7,.2,1) forwards;margin-right:.24em}
@keyframes wi{to{opacity:1;transform:none;filter:none}}
.sub{font-size:38px;line-height:1.3;color:#d9d3c4;margin-top:30px;max-width:780px;opacity:0;animation:wi .8s .45s cubic-bezier(.2,.7,.2,1) forwards}
.dots{margin-top:auto;display:flex;gap:14px;align-items:center}
.dots b{width:16px;height:16px;border-radius:50%;border:3px solid #4a463d;transition:.4s}.dots b.on.h{background:var(--gold);border-color:var(--gold);transform:scale(1.3)}.dots b.on.p{background:var(--green);border-color:var(--green);transform:scale(1.3)}
.dots span{margin-left:14px;font-size:20px;letter-spacing:.14em;color:var(--muted);font-weight:700}
.stack{position:absolute;right:190px;top:120px;width:449px;height:948px;transform-origin:60% 50%;animation:drift 12s ease-out forwards}
@keyframes drift{from{transform:scale(1)}to{transform:scale(1.07)}}
.pf{position:absolute;inset:0;border:10px solid #1c1c1c;border-radius:56px;background:#F6F1E6;overflow:hidden;box-shadow:0 0 0 3px #2a2a2a,0 50px 120px rgba(0,0,0,.8),0 0 160px rgba(242,176,28,.10);opacity:0;transition:opacity .6s}
.pf.on{opacity:1}
.pf iframe{position:absolute;left:0;top:0;width:390px;height:844px;border:0;transform:scale(1.1);transform-origin:0 0}
.who{position:absolute;right:190px;top:76px;width:449px;text-align:center;font-weight:700;letter-spacing:.2em;font-size:18px;color:var(--muted)}
.ban{position:absolute;right:210px;top:150px;width:409px;background:rgba(250,246,235,.96);color:#111;border-radius:26px;padding:16px 20px;z-index:60;box-shadow:0 20px 50px rgba(0,0,0,.5);transform:translateY(-190px);opacity:0;transition:transform .55s cubic-bezier(.2,.9,.2,1),opacity .4s}
.ban.on{transform:none;opacity:1}.ban small{font-size:14px;letter-spacing:.14em;font-weight:700;color:#7a5a00}.ban b{display:block;font-size:19px;margin-top:4px;line-height:1.25}
.cursor{position:fixed;z-index:200;width:34px;height:34px;border-radius:50%;background:rgba(242,176,28,.92);border:4px solid #fff;box-shadow:0 0 0 2px #111;pointer-events:none;transition:left .34s ease,top .34s ease;left:-80px;top:-80px}
.cursor.click{animation:rip .4s}@keyframes rip{50%{transform:scale(1.8);opacity:.5}}
.card{position:fixed;inset:0;z-index:300;background:var(--ink);display:none;flex-direction:column;justify-content:center;padding:0 170px;gap:26px}.card.on{display:flex}
.card h1{font-family:"DM Serif Display",Georgia,serif;font-weight:400;font-size:150px;line-height:1.02;margin:0;max-width:1500px}.card h1 b{font-weight:400;color:var(--gold)}
.card .w{display:inline-block;opacity:0;transform:translateY(40px);filter:blur(12px);animation:wi .9s cubic-bezier(.2,.7,.2,1) forwards;margin-right:.24em}
.card p{font-size:40px;color:#d9d3c4;margin:0;opacity:0;animation:wi .9s 1.1s forwards}.card small{font-size:20px;letter-spacing:.16em;color:var(--gold);font-weight:700}
.vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55));z-index:70}
</style></head><body>
<div class="glow" id="glow"></div>
<div class="ex">EXAMPLE DATA: fictional people, numbers and company. Not real records.</div>
<div class="left"><div class="chip" id="chip"><span id="chipt">HR</span><i></i></div><h1 class="head" id="head"></h1><p class="sub" id="sub"></p>
 <div class="dots" id="dots"><b class="h"></b><b class="h"></b><b class="h"></b><b class="h"></b><b class="h"></b><b class="p"></b><b class="p"></b><b class="h"></b><b class="p"></b><b class="p"></b><b class="p"></b><span id="dotl"></span></div></div>
<div class="who" id="who">HR</div>
<div class="stack" id="stack"><div class="pf on" id="pfA"><iframe id="fA" src="../gcg-game-plan.html"></iframe></div><div class="pf" id="pfB"><iframe id="fB" src="../gcg-game-plan.html"></iframe></div></div>
<div class="ban" id="ban"><small>GOLD COAST GAMES</small><b id="bant"></b></div>
<div class="vig"></div>
<div id="mk" style="position:fixed;left:0;bottom:0;width:14px;height:14px;background:#0c0c0c;z-index:400"></div><div class="card" id="card"></div><div class="cursor" id="cursor"></div>
<script>
var $=function(i){return document.getElementById(i);};
function words(t){return t.split(' ').map(function(w,i){return '<span class="w" style="animation-delay:'+(i*0.11)+'s">'+w+'</span>';}).join('');}
window.beat=function(o){var mk=$('mk');mk.dataset.s=mk.dataset.s==='1'?'0':'1';mk.style.background=mk.dataset.s==='1'?'#2c2c2c':'#0c0c0c';var p=o.group==='p';
 $('chip').classList.toggle('p',p);$('glow').classList.toggle('p',p);$('chipt').textContent=o.who||(p?'THE PERSON':'HR');
 $('head').innerHTML=words(o.head);$('sub').style.animation='none';void $('sub').offsetWidth;$('sub').style.animation='';$('sub').textContent=o.sub||'';
 var st=$('stack');st.style.animation='none';void st.offsetWidth;st.style.animation='';
 var d=document.querySelectorAll('#dots b');for(var i=0;i<d.length;i++)d[i].classList.toggle('on',i===o.idx);$('dotl').textContent=o.label||'';
 $('who').textContent=o.name||'';};
window.show=function(w){$('pfA').classList.toggle('on',w==='A');$('pfB').classList.toggle('on',w==='B');};
window.cur=function(x,y){var c=$('cursor');c.style.left=x+'px';c.style.top=y+'px';};
window.ripple=function(){var c=$('cursor');c.classList.remove('click');void c.offsetWidth;c.classList.add('click');};
window.banner=function(t){var b=$('ban');if(!t){b.classList.remove('on');return;}$('bant').textContent=t;b.classList.add('on');};
window.cardOn=function(h,s,k){var e=$('card');if(!h){e.classList.remove('on');return;}var mk=$('mk');mk.dataset.s=mk.dataset.s==='1'?'0':'1';mk.style.background=mk.dataset.s==='1'?'#2c2c2c':'#0c0c0c';
 e.innerHTML=(k?'<small>'+k+'</small>':'')+'<h1>'+words(h)+'</h1>'+(s?'<p>'+s+'</p>':'');e.classList.add('on');};
</script></body></html>
